<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いろいろ図鑑</title>
<meta name="theme-color" content="#3a7bd5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",system-ui,sans-serif;background:#eef2f7;color:#222;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,textarea{font:inherit}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--page,#fff);position:relative;overflow:hidden}
rt{font-size:.5em}
/* ヘッダー */
.hd{display:flex;align-items:center;gap:6px;padding:8px 8px;padding-top:max(8px,env(safe-area-inset-top));background:var(--cover,#3a7bd5);color:var(--coverText,#fff);flex:none;box-shadow:0 2px 6px rgba(0,0,0,.15);position:relative;z-index:2}
.hd h1{flex:1;margin:0;font-size:20px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.hb{min-width:44px;height:44px;border-radius:12px;font-size:20px;font-weight:700;display:grid;place-items:center;padding:0 8px}
.hb:active{background:rgba(255,255,255,.25)}
.hb small{font-size:12px}
.body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.foot{flex:none;display:flex;gap:8px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:rgba(255,255,255,.92);border-top:1px solid rgba(0,0,0,.08)}
.big{flex:1;min-height:52px;border-radius:16px;font-size:18px;font-weight:800;background:var(--cover,#3a7bd5);color:var(--coverText,#fff);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.big.sub{background:#fff;color:#333;border:2px solid #ccd}
.big:disabled{opacity:.5}
/* 本だな */
.shelf{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.book{aspect-ratio:3/4;border-radius:6px 14px 14px 6px;padding:12px 10px 10px 18px;color:#fff;text-align:left;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.2),inset 8px 0 0 rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
.book b{font-size:17px;line-height:1.3;word-break:break-all;position:relative}
.book .cnt{margin-top:auto;font-size:13px;font-weight:700;position:relative}
.book .mini{position:absolute;right:8px;bottom:30px;width:56px;height:56px;border-radius:10px;background:#fff center/cover;border:3px solid rgba(255,255,255,.9)}
.book.add{background:#fff;color:#567;border:3px dashed #9ab;box-shadow:none;align-items:center;justify-content:center;text-align:center;font-weight:800;padding:10px}
.book.add span{font-size:40px;line-height:1}
.saveload{display:flex;gap:10px;padding:4px 14px 12px}.saveload button{flex:1;padding:14px 8px;border-radius:14px;font-size:17px;font-weight:800;background:#fff;border:2px solid #2a5ca8;color:#2a5ca8}
.note{padding:0 14px 20px;font-size:13px;color:#667;line-height:1.7}
.note button{text-decoration:underline;color:#2a5ca8;font-weight:700;padding:4px 2px}
/* 図鑑のなかみ */
.count{padding:10px 14px 0;font-weight:800;color:var(--ink,#334)}
.grid{padding:10px 12px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:rgba(255,255,255,.88);border-radius:12px;padding:6px 6px 6px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.card .ph{width:100%;aspect-ratio:1;background:#ddd center/cover no-repeat}
.card .no{font-size:11px;color:#778;font-weight:700;margin-top:4px}
.card .nm{font-size:13px;font-weight:800;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--ink,#556);line-height:1.9;font-weight:700}
.empty .e{font-size:56px}
/* わくの形 */
.f-square .ph,.f-square.ph{border-radius:6px}
.f-round .ph,.f-round.ph{border-radius:24%}
.f-circle .ph,.f-circle.ph{border-radius:50%}
.f-star .ph,.f-star.ph{clip-path:polygon(50% 2%,62% 36%,98% 37%,69% 59%,79% 95%,50% 74%,21% 95%,31% 59%,2% 37%,38% 36%)}
/* デザイン(ページのもよう) */
.d-plain{}
.d-note{background-image:repeating-linear-gradient(transparent 0 27px,rgba(70,110,170,.18) 27px 28px)}
.d-dot{background-image:radial-gradient(rgba(0,0,0,.09) 18%,transparent 20%);background-size:22px 22px}
.d-grid{background-image:linear-gradient(rgba(0,0,0,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.07) 1px,transparent 1px);background-size:20px 20px}
.d-star{background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.9) 1.5px,transparent 2px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.7) 1px,transparent 1.6px),radial-gradient(circle at 45% 85%,rgba(255,255,255,.8) 1.2px,transparent 1.8px);background-size:90px 90px,70px 70px,110px 110px}
.d-stripe{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 12px,transparent 12px 24px)}
/* へんしゅう */
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px;background:repeating-conic-gradient(#e6e9ee 0 25%,#f6f7f9 0 50%) 0 0/20px 20px}
.stage canvas{max-width:100%;max-height:100%;box-shadow:0 3px 10px rgba(0,0,0,.25);background:#fff}
.tools{flex:none;background:#fff;border-top:1px solid #dde;padding:6px 8px 4px}
.trow{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:6px}
.tb{flex:1;max-width:84px;height:44px;border-radius:12px;background:#f0f3f8;border:2px solid #d5dbe6;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tb i{font-style:normal;font-size:19px}
.tb.on{background:#ffe9a8;border-color:#e0b200}
.pal{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.pal::-webkit-scrollbar{display:none}
.sw{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ccd;position:relative}
.sw.on{box-shadow:0 0 0 3px #222}
.sw.none{background:linear-gradient(135deg,#fff 45%,#e33 45% 55%,#fff 55%)}
.sw.pick{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.sw.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.lbl{font-size:12px;font-weight:800;color:#556;flex:none}
.trow input[type=range]{flex:1;accent-color:var(--cover,#3a7bd5);height:30px}
/* なまえ入力 */
.form{padding:12px 14px 20px;display:grid;gap:12px}
.prev{width:min(46vw,170px);aspect-ratio:1;margin:0 auto;background:#fff center/contain no-repeat;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.fl{font-weight:800;font-size:14px;color:var(--ink,#334)}
.in{width:100%;padding:12px;border-radius:12px;border:2px solid #cfd6e2;font-size:18px;background:#fff}
textarea.in{font-size:16px;min-height:76px;resize:vertical}
.stars{display:flex;gap:4px}
.stars button{font-size:30px;line-height:1;width:44px;height:44px;color:#ccc}
.stars button.on{color:#f5b400}
/* くわしく */
.detail{padding:10px 14px 16px;text-align:center;color:var(--ink,#334)}
.detail .ph{width:min(82vw,330px,36dvh);aspect-ratio:1;border-radius:10px;margin:0 auto;background:#fff center/contain no-repeat;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.detail .no{margin-top:10px;font-weight:800;color:#778}
.detail h2{margin:2px 0 4px;font-size:26px;word-break:break-all}
.detail .st{color:#f5b400;font-size:22px;letter-spacing:2px}
.detail .memo{color:#222;text-align:left;background:rgba(255,255,255,.88);border-radius:12px;padding:10px 12px;margin-top:10px;white-space:pre-wrap;word-break:break-all;line-height:1.7;min-height:44px}
.detail .dt{font-size:12px;color:#778;margin-top:8px}
.nav{display:flex;justify-content:space-between;margin-top:8px}
.nav button{font-weight:800;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.88)}
.nav button:disabled{opacity:.3}
/* せってい */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{color:#222;padding:8px 12px;border-radius:12px;border:2px solid #cfd6e2;background:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.opt.on{border-color:#222;background:#ffe9a8}
.opt .smp{width:30px;height:30px;border-radius:6px;border:1px solid #ccd}
.danger{color:#c22;font-weight:800;text-decoration:underline;padding:10px 0;justify-self:start}
/* ダイアログ */
.dlg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.dlg>div{background:#fff;border-radius:18px;padding:20px 16px 16px;width:100%;max-width:330px;display:grid;gap:14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dlg b{font-size:18px}
.dlg p{margin:0;font-size:14px;color:#555;line-height:1.6}
.dlg .row{display:flex;gap:10px}
.dlg .row button{flex:1;padding:12px;border-radius:12px;font-weight:800;border:2px solid #ccd;background:#fff}
.dlg .row button.y{background:#3a7bd5;color:#fff;border-color:#3a7bd5}
.dlg .row button.r{background:#d33;color:#fff;border-color:#d33}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(20,20,30,.85);color:#fff;padding:10px 18px;border-radius:20px;font-weight:800;z-index:60;pointer-events:none;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
.hide{display:none!important}
.zoomable{display:block;position:relative;padding:0;border:0}
.zm{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:18px}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;animation:vin .22s ease-out}
.viewer img{max-width:100vw;max-height:100dvh;object-fit:contain}
.viewer.out{opacity:0;transition:opacity .2s}
.vx{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:22px;font-weight:800}
@keyframes vin{from{opacity:0;transform:scale(.8)}}
/* 表紙(ズーム→めくる) */
#cover{position:fixed;z-index:40;perspective:1800px;overflow:visible;cursor:pointer;border-radius:0}
.cv{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;border-radius:inherit}
.cv-front,.cv-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:inherit}
.cv-front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3dvh;padding:24px 24px 24px 44px;box-shadow:inset 22px 0 0 rgba(0,0,0,.2),inset 26px 0 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.35);text-align:center}
.cv.sheet{pointer-events:none}
#cover.flip{pointer-events:none}
.sheet .cv-front{box-shadow:inset 10px 0 18px rgba(0,0,0,.12)}
.cv-back{pointer-events:none;transform:rotateY(180deg);box-shadow:inset -18px 0 30px rgba(0,0,0,.18)}
.cv-t{font-size:min(9vw,40px);line-height:1.3;word-break:break-all;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.cv-ph{width:min(52vw,36dvh,260px);aspect-ratio:1;background:rgba(255,255,255,.9) center/cover no-repeat;border:6px solid rgba(255,255,255,.95);box-shadow:0 6px 16px rgba(0,0,0,.25);display:grid;place-items:center;font-size:64px}
.cv-ph.f-star{border:0}
.cv-n{font-size:20px;font-weight:800}
.cv-hint{font-size:15px;font-weight:800;padding:8px 18px;border-radius:20px;background:rgba(0,0,0,.22);color:#fff;opacity:0;transition:opacity .3s}
#cover.ready .cv-hint{opacity:1;animation:hint 1.4s ease-in-out .3s infinite}
#cover.flip .cv-hint,#cover.flip .cv-x{opacity:0}
@keyframes hint{50%{transform:scale(1.08)}}
.cv-x{z-index:2;transform:translateZ(2px);position:absolute;left:30px;top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border-radius:12px;font-size:20px;font-weight:800;color:inherit;background:rgba(0,0,0,.12)}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fPick" accept="image/*" hidden>
<input type="file" id="fBackup" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
